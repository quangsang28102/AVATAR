<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<canvas id="c"></canvas>
<script>
window.onload = function() {
  const img = new Image();
  img.src = 'girl.png';
  img.onload = function() {
    const canvas = document.getElementById('c');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, img.width, img.height).data;
    const w = img.width;
    const h = img.height;

    // Background color at corner (10, 10)
    const bgR = data[(10 * w + 10) * 4];
    const bgG = data[(10 * w + 10) * 4 + 1];
    const bgB = data[(10 * w + 10) * 4 + 2];

    let minX = w, maxX = 0, minY = h, maxY = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
        if (diff > 45) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    // Vertical scan down the centerline (x = Math.round((minX + maxX)/2))
    const cx = Math.round((minX + maxX) / 2);
    const profile = [];
    for (let y = minY; y <= maxY; y += 10) {
      const idx = (y * w + cx) * 4;
      profile.push({
        y: y - minY,
        r: data[idx],
        g: data[idx+1],
        b: data[idx+2],
        hex: '#' + ((1 << 24) + (data[idx] << 16) + (data[idx+1] << 8) + data[idx+2]).toString(16).slice(1)
      });
    }

    // Horizontal width scans at various height percentages (from bottom 0% to top 100%)
    const characterHeight = maxY - minY;
    const widthScan = [];
    for (let pct = 0; pct <= 100; pct += 5) {
      const y = Math.round(maxY - (pct / 100) * characterHeight);
      let left = w, right = 0;
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const diff = Math.abs(data[idx] - bgR) + Math.abs(data[idx+1] - bgG) + Math.abs(data[idx+2] - bgB);
        if (diff > 45) {
          if (x < left) left = x;
          if (x > right) right = x;
        }
      }
      widthScan.push({
        heightPct: pct,
        y: y - minY,
        width: right >= left ? right - left : 0,
        leftX: left - minX,
        rightX: right - minX
      });
    }

    const res = {
      imageSize: { w, h },
      boundingBox: { minX, maxX, minY, maxY, width: maxX - minX, height: maxY - minY },
      centerlineProfile: profile,
      widthDistribution: widthScan
    };

    const out = document.createElement('pre');
    out.id = 'result';
    out.innerText = JSON.stringify(res, null, 2);
    document.body.appendChild(out);
  };
};
</script>
</body>
</html>
