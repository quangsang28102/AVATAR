<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Low-Poly Seer Preview</title>
  <style>
    body {
      margin: 0;
      background-color: #211c26;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/addons/": "./libs/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/GLTFExporter.js';
    import { OBJExporter } from 'three/addons/OBJExporter.js';
    import { createSeerCharacter } from './seer-model.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x211c26);

    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'front';

    // Camera setup for Seer (Total Height ~ 1.15, center ~ 0.58)
    const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 100);
    const target = new THREE.Vector3(0, 0.58, 0);

    if (view === 'front') {
      camera.position.set(0, 0.58, 2.3);
    } else if (view === '34') {
      camera.position.set(1.5, 0.82, 1.9);
    } else if (view === 'side') {
      camera.position.set(2.3, 0.58, 0);
    } else if (view === 'back') {
      camera.position.set(0, 0.58, -2.3);
    } else if (view === 'top') {
      camera.position.set(0, 3.0, 0.01);
    } else {
      camera.position.set(0, 0.58, 2.3);
    }

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(target);
    controls.update();

    // Lighting (Warm Key, Cool Fill, Amber Rim, Soft Ambient)
    const ambientLight = new THREE.AmbientLight(0xdcd4e4, 0.85);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff2e4, 1.25);
    keyLight.position.set(2.8, 4.8, 3.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9888b4, 0.65);
    fillLight.position.set(-3.5, 2.5, 2.5);
    scene.add(fillLight);

    const frontLight = new THREE.DirectionalLight(0xfff4ea, 0.60);
    frontLight.position.set(0, 1.2, 4.0);
    scene.add(frontLight);

    const rimLight = new THREE.DirectionalLight(0xffb26c, 0.65);
    rimLight.position.set(-3.2, 3.5, 1.8);
    scene.add(rimLight);

    // Floor Pedestal Disc
    const floorGeo = new THREE.CylinderGeometry(1.6, 1.7, 0.06, 24);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x221a2c,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -0.03;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Character
    const seerData = createSeerCharacter();
    scene.add(seerData.model);

    // Animation loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      if (seerData.update) seerData.update(elapsed);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Export Trigger via URL
    if (urlParams.get('export') === 'glb') {
      setTimeout(() => {
        const exporter = new GLTFExporter();
        exporter.parse(
          seerData.model,
          function (gltf) {
            fetch('/save-file?name=seer.glb', {
              method: 'POST',
              body: gltf
            }).then(() => console.log('GLB exported successfully'));
          },
          { binary: true }
        );
      }, 500);
    }

    if (urlParams.get('export') === 'obj') {
      setTimeout(() => {
        const exporter = new OBJExporter();
        const result = exporter.parse(seerData.model);
        fetch('/save-file?name=seer.obj', {
          method: 'POST',
          body: result
        }).then(() => console.log('OBJ exported successfully'));
      }, 500);
    }
  </script>
</body>
</html>
