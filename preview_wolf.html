<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Low-Poly Werewolf Preview</title>
  <style>
    body {
      margin: 0;
      background-color: #1e1c25;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/addons/": "./libs/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/GLTFExporter.js';
    import { OBJExporter } from 'three/addons/OBJExporter.js';
    import { createWolfCharacter } from './wolf-model.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1c25);

    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'front';

    // Camera setup for Chibi Werewolf (Total Height ~ 1.0, center ~ 0.48)
    const camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 100);
    const target = new THREE.Vector3(0, 0.48, 0);

    if (view === 'front') {
      camera.position.set(0, 0.50, 2.22);
    } else if (view === '34') {
      // 3/4 Perspective Angle exactly matching concept art pose
      camera.position.set(1.4, 0.75, 1.8);
    } else if (view === 'side') {
      camera.position.set(2.2, 0.50, 0);
    } else if (view === 'back') {
      camera.position.set(0, 0.50, -2.22);
    } else if (view === 'top') {
      camera.position.set(0, 2.8, 0.01);
    } else {
      camera.position.set(0, 0.50, 2.22);
    }

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(target);
    controls.update();

    // Studio Lighting matching Cinematic Dark Fantasy Forest (Moonlit Purple Rim & Crisp Key)
    const ambientLight = new THREE.AmbientLight(0x3e3c4e, 1.25);
    scene.add(ambientLight);

    const purpleRim = new THREE.DirectionalLight(0xc084fc, 2.6);
    purpleRim.position.set(-1.5, 2.5, -2.0);
    scene.add(purpleRim);

    const rightRim = new THREE.DirectionalLight(0x6078a6, 0.60);
    rightRim.position.set(2.5, 2.0, -1.5);
    scene.add(rightRim);

    const frontFill = new THREE.DirectionalLight(0xe0e8f8, 1.28);
    frontFill.position.set(0.8, 3.2, 2.5);
    frontFill.castShadow = true;
    frontFill.shadow.mapSize.width = 2048;
    frontFill.shadow.mapSize.height = 2048;
    frontFill.shadow.bias = -0.0005;
    scene.add(frontFill);

    const bottomBounce = new THREE.DirectionalLight(0x525a75, 0.40);
    bottomBounce.position.set(0, -1.0, 0.8);
    scene.add(bottomBounce);

    // Low-poly ground pedestal disc
    const floorGeo = new THREE.CylinderGeometry(1.6, 1.7, 0.06, 24);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x16141e,
      roughness: 0.92,
      metalness: 0.05,
      flatShading: true
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -0.03;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Character
    const wolfData = createWolfCharacter();
    scene.add(wolfData.model);

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Export Trigger via URL
    if (urlParams.get('export') === 'glb') {
      setTimeout(() => {
        const exporter = new GLTFExporter();
        exporter.parse(
          wolfData.model,
          function (gltf) {
            fetch('/save-file?name=wolf.glb', {
              method: 'POST',
              body: gltf
            }).then(() => console.log('GLB exported successfully'));
          },
          { binary: true }
        );
      }, 500);
    }

    if (urlParams.get('export') === 'obj') {
      setTimeout(() => {
        const exporter = new OBJExporter();
        const result = exporter.parse(wolfData.model);
        fetch('/save-file?name=wolf.obj', {
          method: 'POST',
          body: result
        }).then(() => console.log('OBJ exported successfully'));
      }, 500);
    }
  </script>
</body>
</html>
