<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Side-by-Side Comparison: Seer Reference vs 3D Model</title>
  <style>
    body {
      margin: 0;
      background: #1c1822;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: #de55fb;
    }
    .comparison-container {
      display: flex;
      gap: 24px;
      background: #251f2e;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .label {
      font-size: 15px;
      font-weight: 600;
      color: #e06cfc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .img-box {
      width: 460px;
      height: 600px;
      background: #211c26;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h2>🔮 Đối Chiếu 1:1 - Ảnh Mẫu (Seer) vs Mô Hình 3D (Three.js)</h2>
  <div class="comparison-container">
    <div class="col">
      <div class="label">Ảnh mẫu gốc (Reference)</div>
      <div class="img-box">
        <img src="seer_ref.png" alt="Ảnh mẫu gốc">
      </div>
    </div>
    <div class="col">
      <div class="label">Mô hình 3D Three.js (Front View)</div>
      <div class="img-box">
        <img src="render_seer_front.png" alt="Mô hình 3D Three.js">
      </div>
    </div>
  </div>
</body>
</html>
