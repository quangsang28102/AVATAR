<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Low-Poly Seer Preview</title>
  <style>
    body {
      margin: 0;
      background-color: #181322;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../libs/three.module.js",
      "three/addons/": "../libs/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/GLTFExporter.js';
    import { OBJExporter } from 'three/addons/OBJExporter.js';
    import { createSeerCharacter } from '../js/seer-model.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181322);

    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'front';

    // Camera framed fairly for 1:1 comparison with seer_ref.png (model height ~0.88m, center ~0.44m)
    const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 100);
    const target = new THREE.Vector3(0, 0.44, 0);

    if (view === 'front') {
      camera.position.set(0, 0.45, 1.98);
    } else if (view === '34') {
      camera.position.set(1.25, 0.66, 1.68);
    } else if (view === 'side') {
      camera.position.set(2.08, 0.45, 0);
    } else if (view === 'back') {
      camera.position.set(0, 0.45, -1.98);
    } else if (view === 'top') {
      camera.position.set(0, 2.75, 0.01);
    } else if (view === 'closeup_front') {
      target.set(0, 0.605, 0.02);
      camera.position.set(0, 0.605, 0.80);
    } else if (view === 'closeup_34') {
      target.set(0, 0.605, 0.02);
      camera.position.set(0.49, 0.66, 0.66);
    } else {
      camera.position.set(0, 0.45, 1.98);
    }

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(target);
    controls.update();

    // Balanced Studio Lighting (warm peach skin preservation + gentle hood rim + soft inner cavity depth)
    const hemiLight = new THREE.HemisphereLight(0xfff4ed, 0x5c3e5a, 0.94);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff4ea, 1.15);
    keyLight.position.set(-1.9, 3.2, 3.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 10;
    keyLight.shadow.camera.left = -1.4;
    keyLight.shadow.camera.right = 1.4;
    keyLight.shadow.camera.top = 1.6;
    keyLight.shadow.camera.bottom = -1.4;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xf3e8f8, 0.88);
    fillLight.position.set(2.7, 1.35, 3.1);
    scene.add(fillLight);

    const frontLight = new THREE.DirectionalLight(0xfff1e6, 0.79);
    frontLight.position.set(0.12, 0.44, 3.9);
    scene.add(frontLight);

    const backRim = new THREE.DirectionalLight(0xe3b8ff, 1.02);
    backRim.position.set(-1.5, 2.3, -2.5);
    scene.add(backRim);

    // Floor Pedestal Disc
    const floorGeo = new THREE.CylinderGeometry(1.6, 1.7, 0.06, 24);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x20192b,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -0.03;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Character
    const seerData = createSeerCharacter();
    const poseParam = urlParams.get('pose');
    if (poseParam) {
      seerData.setPose(poseParam);
    }
    const effectUpdates = {};
    if (urlParams.get('particles') === 'off') effectUpdates.particles = false;
    if (urlParams.get('orbGlow') === 'off') effectUpdates.orbGlow = false;
    if (urlParams.get('orbFloat') === 'off') effectUpdates.orbFloat = false;
    const intensityParam = parseFloat(urlParams.get('intensity'));
    if (!Number.isNaN(intensityParam)) effectUpdates.intensity = intensityParam;
    if (Object.keys(effectUpdates).length > 0) {
      seerData.setEffects(effectUpdates);
    }
    scene.add(seerData.model);

    // Animation loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      if (seerData.update) seerData.update(elapsed);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Export Trigger via URL
    if (urlParams.get('export') === 'glb') {
      setTimeout(async () => {
        try {
          const exporter = new GLTFExporter();
          const gltf = await exporter.parseAsync(seerData.model, { binary: true });
          await fetch('/save-file?name=seer.glb', {
            method: 'POST',
            body: gltf
          });
          console.log('GLB exported successfully');
        } catch (err) {
          console.error('GLB export failed', err);
        }
      }, 500);
    }

    if (urlParams.get('export') === 'obj') {
      setTimeout(async () => {
        try {
          const exporter = new OBJExporter();
          const result = exporter.parse(seerData.model);
          await fetch('/save-file?name=seer.obj', {
            method: 'POST',
            body: result
          });
          console.log('OBJ exported successfully');
        } catch (err) {
          console.error('OBJ export failed', err);
        }
      }, 500);
    }
  </script>
</body>
</html>
